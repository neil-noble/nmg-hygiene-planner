project: NMG Hygiene Planner
created: 2026-10-27
owner_request: Mark Shanhun (NMG) shared his planner and asked Neil to host it
goal: host NMG-Hygiene-Planner.html on the ESA Wix site (live URL /nmghygieneplanner; originally asked for /nmgohstracker)
source: docs/NMG-Hygiene-Planner.html (original, untouched); docs/index.html = served copy (identical)
hosting:
  repo: neil-noble/nmg-hygiene-planner (public; Pages from master:/docs)
  pages_url: https://neil-noble.github.io/nmg-hygiene-planner/
  verified: 2026-10-27 live md5 == local
  wix_page: https://www.emergencyservicesaustralia.com.au/nmghygieneplanner (Neil added 2026-10-27; embeds pages_url)
changes_from_original:
  - 2026-10-27 removed NMG logo + "WHS Governance & Compliance" brand strip (Neil)
  - 2026-10-27 localStorage -> shared Firestore register; team code required to edit (Neil: several people need same progress)
backend:
  firebase_project: nmg-hygiene-planner (Spark/free, Neil's Google account; Firestore australia-southeast1)
  data: years/{year}/entries/{taskId|period} = {done,by,at,note}; live via onSnapshot
  auth: one shared account team@nmg-hygiene-planner.web.app; its password = the TEAM CODE (private/team-code.txt, gitignored, NEVER commit; repo is public)
  signup: disabled (client.permissions.disabledUserSignup) so nobody else can create accounts
  rules: firestore.rules - public read; write only team email + field/size validation; no deletes
  verified_2026-10-27: 11/11 REST rule checks + 8/8 two-browser Playwright checks + live page connects
  admin_scripts: private/ (fbtok.js = access token from firebase CLI login; setup.js; sectest.js)
  change_code: node private/setcode.js <token from private/fbtok.js> <new-code> private  (code set to Neil-chosen value 2026-10-27; see private/team-code.txt)
gotchas:
  - firebase CLI hangs on exit in Git Bash (libuv assertion) -> use REST with token from private/fbtok.js
  - initializeAuth API needs billing; Auth must be started via console "Get started" (done)
  - Mark's pre-existing ticks were in his own browser localStorage; not migrated
phase: 4-live-complete
